<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THOTH CLOUD - Connexion</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/auth.css">
    <link rel="stylesheet" href="styles/cards.css">
    <link rel="stylesheet" href="styles/dark-theme.css" id="theme-style">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-header">
            <div class="logo">
                <div class="logo-icon">🌍</div>
                <div class="logo-text">
                    <h1>THOTH</h1>
                    <p>Cloud Platform</p>
                </div>
            </div>
            <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">
                <span>🌙</span>
            </button>
        </div>

        <div class="auth-card">
            <h2>Connexion</h2>
            <p class="auth-subtitle">Accédez à votre plateforme de gestion VM</p>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur ou Email</label>
                    <input type="text" id="username" required placeholder="admin@thoth.local" autocomplete="on">
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <div class="password-input">
                        <input type="password" id="password" required placeholder="••••••••">
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility()">
                            👁️
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember-me">
                        <span>Se souvenir de moi</span>
                    </label>
                    <a href="#" class="text-link" onclick="showForgotPassword()">Mot de passe oublié ?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <span>🔑</span>
                    Se connecter
                </button>

                <div class="auth-divider">
                    <span>ou</span>
                </div>

                <button type="button" class="btn btn-secondary btn-block" onclick="window.location.href='register.html'">
                    <span>📝</span>
                    Créer un compte
                </button>
            </form>

            <div class="auth-footer">
                <p>© 2024 THOTH CLOUD</p>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="scripts/auth.js"></script>
    <script src="scripts/theme.js"></script>
    <script src="scripts/modals.js"></script>
</body>
</html>
