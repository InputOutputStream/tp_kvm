<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THOTH CLOUD - Inscription</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/auth.css">
    <link rel="stylesheet" href="styles/cards.css">
    <link rel="stylesheet" href="styles/dark-theme.css" id="theme-style">

</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-header">
            <div class="logo">
                <div class="logo-icon">🌍</div>
                <div class="logo-text">
                    <h1>THOTH</h1>
                    <p>Cloud Platform</p>
                </div>
            </div>
            <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">
                <span>🌙</span>
            </button>
        </div>

        <div class="auth-card">
            <h2>Créer un compte</h2>
            <p class="auth-subtitle">Rejoignez la plateforme de gestion VM</p>

            <form id="register-form" onsubmit="handleRegister(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label for="first-name">Prénom *</label>
                        <input type="text" id="first-name" required placeholder="John">
                    </div>
                    <div class="form-group">
                        <label for="last-name">Nom *</label>
                        <input type="text" id="last-name" required placeholder="Doe">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" required placeholder="john.doe@example.com">
                </div>

                <div class="form-group">
                    <label for="username">Nom d'utilisateur *</label>
                    <input type="text" id="username" required placeholder="johndoe">
                    <small>Lettres, chiffres et underscores uniquement</small>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe *</label>
                    <div class="password-input">
                        <input type="password" id="password" required placeholder="••••••••">
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility()">
                            👁️
                        </button>
                    </div>
                    <div class="password-strength" id="password-strength">
                        <div class="strength-bar"></div>
                        <span class="strength-text">Faible</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirmer le mot de passe *</label>
                    <input type="password" id="confirm-password" required placeholder="••••••••">
                </div>

                <div class="form-group">
                    <label for="role">Rôle *</label>
                    <select id="role" required>
                        <option value="">Sélectionner un rôle</option>
                        <option value="user">Utilisateur Standard</option>
                        <option value="admin">Administrateur</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="terms" required>
                        <span>J'accepte les <a href="#" class="text-link">conditions d'utilisation</a> et la <a href="#" class="text-link">politique de confidentialité</a></span>
                    </label>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-block">
                        <span>📝</span>
                        Créer mon compte
                    </button>
                    <button type="button" class="btn btn-secondary btn-block" onclick="window.location.href='login.html'">
                        <span>←</span>
                        Retour à la connexion
                    </button>
                </div>
            </form>

            <div class="auth-footer">
                <p>Déjà un compte ? <a href="login.html" class="text-link">Connectez-vous</a></p>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="scripts/auth.js"></script>
    <script src="scripts/theme.js"></script>
    <script src="scripts/modals.js"></script>
</body>
</html>
